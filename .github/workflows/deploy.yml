# Build the agent and deploy it to GitHub Pages. Run by hand: Actions -> deploy
# -> Run workflow.
#
# The site is the page, bundled by Vite (vite.config.js): React, the agent's
# modules, jsLab's runtime and bash.js. The engine and the guest images aren't
# copied: the page loads them from TinyEMU's and TinyEMU-distros' GitHub Pages
# (js/distros.js names the engine release).
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Build the site
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
