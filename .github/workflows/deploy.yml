# Build the agent and deploy it to GitHub Pages. Run by hand: Actions -> deploy
# -> Run workflow.
#
# The site is only the page, jsLab's runtime and bash.js. The engine and the
# guest images aren't copied: the page loads them from TinyEMU's and
# TinyEMU-distros' GitHub Pages (js/distros.js names the engine release).
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tests
        run: node --test "tests/*.test.mjs"
      - name: Build the site
        run: node scripts/build.mjs --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
